name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hiring
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain server/db/migrations)" ]; then
            echo "::error::server/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain server/db/migrations
            exit 1
          fi

      - name: Migrations apply to a real Postgres (twice, to prove they're idempotent)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hiring
        run: npm run db:migrate && npm run db:migrate

      - name: Build
        run: npm run build

      - name: End-to-end smoke test (mock mode)
        run: npm run smoke

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image has the system libraries preinstalled; installing them with apt on every
    # run was slow and sometimes hung. Keep the tag in step with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Chromium for this Playwright version (already in the image unless versions drifted)
        run: npx playwright install chromium

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Fail on high or critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>York Press Hiring</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: app shell, a fixed left rail of views per role, a work area with tables and a slide-in candidate drawer */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --surface-2:#E9EFEE; --line:#D6DFDD; --fg:#132220; --muted:#5A6B68;
  --accent:#0D6B5B; --accent-fg:#FFFFFF; --accent-soft:#DCEFEA;
  --good:#1E7A3B; --good-soft:#E1F2E5; --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#B0281C; --bad-soft:#FBE4E1; --info:#2C5AA3; --info-soft:#E2EAF8;
  --shadow:0 12px 40px rgba(10,30,28,.18);
  --display:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1615; --surface:#152120; --surface-2:#1B2A28; --line:#2A3B39; --fg:#E4EEEC; --muted:#93A6A2;
  --accent:#4CC2AC; --accent-fg:#06221D; --accent-soft:#163C35;
  --good:#5CC47C; --good-soft:#173525; --warn:#E3A848; --warn-soft:#3A2C12; --bad:#F07B6E; --bad-soft:#3E1D1A; --info:#82A8EA; --info-soft:#1B2A45;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1615; --surface:#152120; --surface-2:#1B2A28; --line:#2A3B39; --fg:#E4EEEC; --muted:#93A6A2;
  --accent:#4CC2AC; --accent-fg:#06221D; --accent-soft:#163C35;
  --good:#5CC47C; --good-soft:#173525; --warn:#E3A848; --warn-soft:#3A2C12; --bad:#F07B6E; --bad-soft:#3E1D1A; --info:#82A8EA; --info-soft:#1B2A45;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.65rem;line-height:1.2}
h2{font-size:1.2rem}
h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:16px}
.mast{display:flex;align-items:baseline;gap:10px}
.mast .mark{font-family:var(--display);font-weight:700;font-size:1.35rem}
.mast .tag{font-size:12px;color:var(--muted)}
.demo-users{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-users button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer}
.demo-users button:hover{border-color:var(--accent)}
.demo-users b{display:block;font-weight:600}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.rail nav{display:grid;gap:2px}
.rail nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:7px;background:none;cursor:pointer;color:var(--fg)}
.rail nav button:hover{background:var(--surface-2)}
.rail nav button.on{background:var(--accent-soft);color:var(--fg);font-weight:600}
.count{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border-radius:99px;padding:1px 7px;color:var(--muted)}
.on .count{background:var(--surface)}
.who{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.who select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:grid;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head .left{display:grid;gap:4px;min-width:0}
.demo-banner{font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}
.panel>h3{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-draft{background:var(--surface-2);color:var(--muted)}
.p-submitted{background:var(--info-soft);color:var(--info)}
.p-changes{background:var(--warn-soft);color:var(--warn)}
.p-rejected{background:var(--bad-soft);color:var(--bad)}
.p-sourcing{background:var(--info-soft);color:var(--info)}
.p-open{background:var(--good-soft);color:var(--good)}
.p-new{background:var(--surface-2);color:var(--muted)}
.p-contacted{background:var(--info-soft);color:var(--info)}
.p-replied{background:var(--accent-soft);color:var(--accent)}
.p-interview{background:var(--good-soft);color:var(--good)}
.p-hired{background:var(--good-soft);color:var(--good)}
.p-queued{background:var(--warn-soft);color:var(--warn)}
.p-sent{background:var(--good-soft);color:var(--good)}
.p-noemail{background:var(--surface-2);color:var(--muted)}
.p-cancelled{background:var(--surface-2);color:var(--muted)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:5px;background:var(--surface-2);color:var(--fg)}
.contender{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 5px;margin-left:6px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.stat .v{font-family:var(--mono);font-size:1.35rem;font-weight:500}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tr.top td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.nm{font-weight:600}
.sub{font-size:12.5px;color:var(--muted)}
.score{display:flex;align-items:center;gap:8px;min-width:110px}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.lo i{background:var(--warn)}
.dec{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.dec button{border:0;background:var(--surface);padding:4px 9px;font-size:12px;cursor:pointer;border-right:1px solid var(--line)}
.dec button:last-child{border-right:0}
.dec button.y{background:var(--good-soft);color:var(--good);font-weight:600}
.dec button.m{background:var(--warn-soft);color:var(--warn);font-weight:600}
.dec button.n{background:var(--bad-soft);color:var(--bad);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select{width:auto;min-width:140px}

/* Request cards */
.req-list{display:grid;gap:10px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;cursor:pointer;text-align:left;width:100%}
.req:hover{border-color:var(--accent)}
.req .meta{font-size:12.5px;color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
dl.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 16px;margin:0}
dl.kv dt{color:var(--muted);font-size:12.5px}
dl.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.timeline{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;font-size:13px}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,14,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.drawer .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bigscore{font-family:var(--mono);font-size:2.2rem;line-height:1;font-weight:500}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:10px;align-items:center;font-size:13px}
.xp{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.xp li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px}
.xp .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.msg{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px}

/* Modal + toast */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:rgba(5,15,14,.45);padding:16px}
.modal-card{background:var(--surface);border-radius:12px;padding:24px;width:100%;max-width:480px;display:grid;gap:16px;box-shadow:var(--shadow)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;color:var(--muted)}
.steps li .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.steps li.run{color:var(--fg)}
.steps li.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--fg)}
.steps li.done .dot{background:var(--accent);border-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:13.5px;max-width:calc(100% - 32px)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{appearance:none;width:40px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}
.paused{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 14px;font-weight:500}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .rail nav{display:flex;overflow-x:auto;width:100%;order:3}
  .rail nav button{width:auto;white-space:nowrap;gap:6px}
  .who{margin:0 0 0 auto;border:0;padding:0;display:flex;align-items:center}
  .who .muted{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  dl.kv{grid-template-columns:minmax(0,1fr)}
  dl.kv dt{margin-top:6px}
  .xp li,.timeline li{grid-template-columns:minmax(0,1fr)}
  .crit{grid-template-columns:minmax(0,1fr) 80px 44px}
}
</style>

<div id="root"></div>

<script>
/* ---------- Sample data (fictional people and companies) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FIRST=["Lina","Omar","Sara","Daniel","Mira","Yusuf","Elena","Karim","Nadia","Tomás","Priya","Jonas","Hana","Marco","Leila","Felix","Aisha","Rami","Ines","Victor","Noor","Adam","Julia","Samir","Chloe","Tariq","Maya","Lukas","Zeina","Ethan","Rania","Pablo","Dana","Hugo","Salma","Igor","Farah","Nikolai","Amira","Theo"];
const LAST=["Haddad","Novak","Rahman","Costa","Khoury","Becker","Saleh","Moreau","Petrov","Aziz","Lindqvist","Mansour","Ferreira","Okafor","Nasser","Kowalski","Barakat","Silva","Hartmann","Yilmaz","Duarte","Farouk","Ivanova","Sabbagh","Meyer","Qasem","Rossi","Hamdan","Nilsen","Zaher"];
const COMPANIES=["Quillstone Media","Larkhaven Books","Brightleaf Learning","Northpine Digital","Atlas & Reed","Copperline Studios","Meridian Press Group","Tidewater Apps","Saltmarsh Publishing","Kestrel Health","Fernway Fintech","Inkwell Labs","Harbor Lane Software","Bluegate Education"];
const LOCS=["Amman, Jordan","Dubai, UAE","London, UK","Berlin, Germany","Lisbon, Portugal","Cairo, Egypt","Toronto, Canada","Warsaw, Poland","Beirut, Lebanon","Barcelona, Spain","Istanbul, Türkiye","Riyadh, Saudi Arabia"];
const SCHOOLS=["University of Jordan","American University of Beirut","University of Leeds","TU Berlin","Universidade de Lisboa","Cairo University","University of Toronto","University of Warsaw"];
const CRITERIA=[["must","Must-have skills",35],["exp","Relevant experience",20],["industry","Industry / domain fit",15],["seniority","Seniority / title match",10],["trajectory","Career trajectory",10],["remote","Remote / time zone / language",5],["signals","Supporting signals",5]];
const PROFILES={
  design:{domain:"product design",titles:["Senior Product Designer","Lead UX Designer","Product Designer II","Senior UX/UI Designer","Design Lead"],prev:["Product Designer","UX Designer","UI Designer","Visual Designer"],degree:["BA Graphic Design","BSc Human-Computer Interaction","BA Interaction Design","MA Digital Design"],skills:["Figma","Design systems","Prototyping","User research","Accessibility (WCAG 2.2)","B2B SaaS","Usability testing","Information architecture","Design ops"],strengths:["Owned a design system used by 4 product teams","Led redesign of a B2B reading platform","Strong prototyping and research evidence in role descriptions","Shipped accessibility work to WCAG 2.2 AA"],gaps:["No B2B SaaS examples listed","Limited design-system ownership","No people-management experience","Portfolio link not public","No publishing or edtech background"],web:[["Portfolio with 6 case studies","portfolio.example"],["Talk on design systems at a regional UX meetup (2025)","meetup.example"],["Open-source Figma plugin, 1.2k installs","plugins.example"]],personal:c=>`Your work as ${c.title} at ${c.company}, especially the design-system ownership described on your profile, stood out to me.`},
  finance:{domain:"finance and FP&A",titles:["Finance Manager","Senior Financial Analyst","FP&A Manager","Financial Controller","Finance Business Partner"],prev:["Financial Analyst","Senior Accountant","Auditor","Accountant"],degree:["BSc Accounting","BA Finance","MSc Finance","BCom Accounting"],skills:["IFRS","FP&A","Budgeting & forecasting","Month-end close","Excel modelling","NetSuite","Power BI","Cash-flow management","Audit"],strengths:["Ran month-end close for a multi-entity group","Built the annual budget and rolling forecast","ACCA/CPA qualified per profile","Led ERP migration to NetSuite"],gaps:["No publishing-industry background","No people-management experience","Limited multi-currency exposure","No ERP implementation experience"],web:[["Co-authored a public article on rolling forecasts (2024)","journal.example"],["Speaker at a regional CFO forum (2025)","forum.example"]],personal:c=>`Your experience leading finance at ${c.company}, including the budgeting and forecasting work on your profile, caught my attention.`},
  editorial:{domain:"editorial and acquisitions",titles:["Acquisitions Editor","Senior Commissioning Editor","Editor","Managing Editor","Development Editor"],prev:["Assistant Editor","Editorial Assistant","Copy Editor","Production Editor"],degree:["BA English Literature","MA Publishing","BA Journalism","MA Creative Writing"],skills:["Acquisitions","List building","Author relations","Contract negotiation","Developmental editing","Rights","Market analysis","Arabic–English"],strengths:["Built a non-fiction list of 30+ titles","Track record of acquiring award-shortlisted titles","Strong author-relations and contract experience"],gaps:["No academic-publishing experience","Limited P&L ownership","No rights-sales exposure"],web:[["Interviewed in a trade publication about list building (2025)","trade.example"],["Judge for a regional book prize (2024)","prize.example"]],personal:c=>`The list you built at ${c.company} and your author-relations experience stood out to me.`}
};
const REDFLAGS=["Three roles under 12 months (2021–2023)","Gap of 14 months (2019–2020) with no explanation on profile","Title on profile differs from dates listed for the same role"];

function genCandidates(roleKey,n,seed,idBase){
  const P=PROFILES[roleKey],r=rng(seed),pick=a=>a[Math.floor(r()*a.length)],out=[];
  const used=new Set();
  for(let i=0;i<n;i++){
    let first,last;do{first=pick(FIRST);last=pick(LAST)}while(used.has(first+last));used.add(first+last);
    const title=pick(P.titles),company=pick(COMPANIES),prevCo=pick(COMPANIES.filter(c=>c!==company)),prevTitle=pick(P.prev);
    const total=Math.round(3+r()*13),curStart=2026-Math.ceil(r()*4),prevStart=curStart-Math.ceil(1+r()*4),firstStart=Math.max(2006,prevStart-Math.ceil(1+r()*4));
    const base=.36+r()*.5,breakdown={};let sum=0;
    CRITERIA.forEach(([k,,w])=>{let f=Math.min(1,Math.max(.15,base+(r()-.5)*.35));const s=Math.round(w*f);breakdown[k]=s;sum+=s});
    const hasEmail=r()>.28,slug=(first+"-"+last).toLowerCase().replace(/[^a-z-]/g,"");
    const rf=r()<.18?[pick(REDFLAGS)]:[];
    const skills=[...new Set([pick(P.skills),pick(P.skills),pick(P.skills),pick(P.skills),pick(P.skills)])];
    const c={id:idBase+"-"+(i+1),first,name:first+" "+last,title,company,location:pick(LOCS),
      headline:`${title} at ${company} · ${skills.slice(0,2).join(" · ")}`,
      linkedin:"linkedin.com/in/sample-"+slug,website:r()>.6?slug+".example":"",
      email:hasEmail?`${slug.replace("-",".")}@example.com`:"",phone:hasEmail&&r()>.55?"+00 555 01"+String(Math.floor(r()*90+10)):"",
      totalYears:Math.max(total,2026-firstStart),relevantYears:Math.max(2,Math.round((2026-firstStart)*(.5+r()*.5))),
      experience:[{title,company,start:curStart,end:"Present"},{title:prevTitle,company:prevCo,start:prevStart,end:curStart},{title:pick(P.prev),company:pick(COMPANIES),start:firstStart,end:prevStart}],
      education:{degree:pick(P.degree),school:pick(SCHOOLS),years:`${firstStart-4}–${firstStart}`},

/* ---------- Render ---------- */
function render(){
  let html;
  if(!S.user)html=vLogin();
  else{const v={requests:vRequests,approvals:vApprovals,request:vRequest,new:vNew,roles:vRoles,role:vRole,outreach:vOutreach,settings:vSettings,notes:vNotes}[S.view]||vRequests;html=shell(v())}
  if(S.drawer)html+=vDrawer();
  if(S.modal)html+=vModal();
  if(S.toast)html+=`<div class="toast" role="status">${esc(S.toast)}</div>`;
  const fy=document.activeElement&&document.activeElement.id;
  $("#root").innerHTML=html;
  if(fy==="fq"){const el=$("#fq");el.focus();el.setSelectionRange(el.value.length,el.value.length)}
}

/* ---------- Actions ---------- */
function decide(kind){
  const r=req(S.reqId),cm=($("#dc").value||"").trim();
  if(kind!=="approve"&&!cm){toast("Add a comment so the manager knows what to change");return}
  if(kind==="reject"){r.status="rejected";r.events.push([TODAY,"Khalil","Rejected",cm]);notify(["manager"],`Khalil rejected ${r.title}`);toast("Request rejected. The manager has been notified.");return}
  if(kind==="changes"){r.status="changes";r.events.push([TODAY,"Khalil","Requested changes",cm]);notify(["manager"],`Khalil requested changes on ${r.title}`);toast("Sent back to the manager with your comment");return}
  r.status="sourcing";r.events.push([TODAY,"Khalil","Approved",cm]);
  const steps=[["Building search brief with Claude","7 title variants"],["Searching People Data Labs + SignalHire","48 + 39 profiles"],["Merging sources, removing York Press staff","50 kept"],["Web search on top 20","34 searches"],["Scoring all 50 against the scorecard","done"],["Revealing Top-10 contacts (SignalHire)","10 credits"],["Queuing email and LinkedIn outreach","10 queued"]];
  S.modal={id:r.id,title:r.title,steps,i:0,done:false};render();
  const tick=()=>{S.modal.i++;if(S.modal.i>=steps.length){
      const cs=genCandidates(r.profile,50,Number(r.id.slice(2))*7,r.id);
      cs.filter(c=>c.top).forEach(c=>{c.outreach=c.email?"queued":"noemail";c.contactDate=TODAY});S.settings.credits-=10;
      S.candidates[r.id]=cs;r.status="open";r.runs.push({date:TODAY,kind:"Initial",found:71,kept:50,newC:0,pdl:71,searches:34,tin:"251k",tout:"43k"});
      r.events.push([TODAY,"System","Sourcing run finished","50 screened, Top 10 flagged"]);
      notify(["recruiter","hm","ceo"],`${r.title}: 50 candidates screened, Top 10 ready`);notify(["manager"],`Khalil approved ${r.title}`);
      S.modal.done=true;render();return}
    render();setTimeout(tick,650)};
  setTimeout(tick,650);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-signin],[data-go],[data-req],[data-role],[data-edit],[data-decide],[data-tab],[data-hm],[data-approve],[data-cand],[data-close],[data-cancel],#rerun,#rescore,#drain,#saveTpl,#readAll,#saveCand,#revealBtn");
  if(!t)return;
  const d=t.dataset;
  if(d.signin)return signIn(d.signin);
  if(d.closemodal!==undefined)S.modal=null;
  if(d.go)return go(d.go,{editId:null});
  if(d.req)return go("request",{reqId:d.req});
  if(d.role)return go("role",{roleId:d.role,roleTab:"top",filters:{q:"",status:"",min:0}});
  if(d.edit)return go("new",{editId:d.edit});
  if(d.decide)return decide(d.decide);
  if(d.tab){S.roleTab=d.tab;return render()}
  if(d.hm){e.stopPropagation();const [id,k]=d.hm.split(/:(?=[a-z]+$)/);const rid=id.split(/-(?=\d+$)/)[0];const c=S.candidates[rid].find(x=>x.id===id);c.hm=c.hm===k?"":k;render();return}
  if(d.approve){e.stopPropagation();const rid=d.approve.split(/-(?=\d+$)/)[0];const c=S.candidates[rid].find(x=>x.id===d.approve);c.outreach="approved";toast(`Approved. Claude in Chrome will send ${c.first}'s LinkedIn message in your next Cowork session.`);return}
  if(t.id==="revealBtn"){const rid=S.drawer.split(/-(?=\d+$)/)[0],c=S.candidates[rid].find(x=>x.id===S.drawer);reveal(c,TODAY);S.settings.credits--;toast(c.email?`Contact revealed for ${c.name} (1 credit)`:`SignalHire found no contact for ${c.name}`);return}
  if(d.cancel){e.stopPropagation();const rid=d.cancel.split(/-(?=\d+$)/)[0];S.candidates[rid].find(x=>x.id===d.cancel).outreach="cancelled";toast("Message cancelled. It won't be sent.");return}
  if(d.cand){if(e.target.closest("[data-stop]"))return;S.drawer=d.cand;return render()}
  if(d.close!==undefined){S.drawer=null;return render()}
  if(t.id==="saveCand"){const rid=S.drawer.split(/-(?=\d+$)/)[0],c=S.candidates[rid].find(x=>x.id===S.drawer);c.status=$("#d-st").value;c.followUp=$("#d-fu").value;c.hmComment=$("#d-cm").value;S.drawer=null;toast(`Saved ${c.name}`);return}
  if(t.id==="drain"){let n=0;Object.values(S.candidates).flat().forEach(c=>{if(c.outreach==="queued"&&S.settings.sentToday<S.settings.cap){c.outreach="sent";c.status="contacted";c.contacted=TODAY;c.followUp="2026-11-03";S.settings.sentToday++;n++}});toast(n?`${n} emails sent from abed.amouneh@york-press.com`:"Daily cap reached. The rest will go tomorrow.");return}
  if(t.id==="saveTpl"){S.template.subject=$("#ts").value;S.template.body=$("#tb").value;toast("Template saved");return}
  if(t.id==="readAll"){myNotes().forEach(n=>n.read=true);return render()}
  if(t.id==="rescore"){toast("Re-scoring 50 candidates with the new weights");return}
  if(t.id==="rerun"){const r=req(S.roleId),cs=S.candidates[r.id],add=genCandidates(r.profile,3,Date.now()%9999,r.id+"N").map((c,i)=>Object.assign(c,{id:r.id+"-"+(cs.length+i+1)}));
    const tenth=cs.filter(c=>c.top).at(-1).score;add[0].score=Math.max(add[0].score,tenth+3);add.forEach(c=>{c.newContender=c.score>tenth;c.revealed=false;c.contactSource="";c.contactDate=""});
    const all=cs.concat(add).sort((a,b)=>b.score-a.score);all.forEach((c,i)=>{c.rank=i+1;c.top=i<10;if(c.top&&c.outreach==="none"){if(!c.revealed){reveal(c,TODAY);S.settings.credits--}c.outreach=c.email?"queued":"noemail"}});
    S.candidates[r.id]=all;r.runs.push({date:TODAY,kind:"Weekly",found:9,kept:3,newC:add.filter(c=>c.newContender).length,pdl:9,searches:6,tin:"31k",tout:"6k"});
    notify(["recruiter","hm"],`${r.title}: weekly refresh added 3 new profiles, ${add.filter(c=>c.newContender).length} beat the current #10`);toast("Weekly refresh done: 3 new profiles, flagged as New contender where they beat #10");return}
});

  if(t.id==="who")return signIn(t.value);
  if(t.id==="fs"){S.filters.status=t.value;render()}
  if(t.id==="fm"){S.filters.min=Number(t.value);render()}
  if(t.id==="ks"){S.settings.autoSend=t.checked;toast(t.checked?"Automatic sending is on":"Automatic sending paused for everyone")}
  if(t.id==="cap"){S.settings.cap=Math.max(1,Number(t.value)||30);toast(`Daily cap set to ${S.settings.cap}`)}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="fq"){S.filters.q=t.value;render()}
  if(t.dataset.w){S.settings.weights[t.dataset.w]=Number(t.value);t.nextElementSibling.textContent=t.value;
    const tot=Object.values(S.settings.weights).reduce((a,b)=>a+b,0),el=$("#wtot");el.textContent=tot+" / 100";el.style.color=tot===100?"var(--good)":"var(--bad)";const rb=$("#rescore");if(rb)rb.disabled=tot!==100}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="loginForm")return signIn("recruiter");
  if(e.target.id==="reqForm"){
    const g=id=>$("#"+id).value.trim(),lines=id=>g(id).split("\n").map(s=>s.trim()).filter(Boolean);
    const profile=g("f-dept")==="Finance"?"finance":g("f-dept")==="Editorial"?"editorial":"design";
    const data={title:g("f-title")||"Untitled role",dept:g("f-dept"),profile,seniority:g("f-sen"),headcount:Number(g("f-hc"))||1,start:g("f-start"),kind:g("f-kind"),jd:g("f-jd"),must:lines("f-must"),nice:lines("f-nice"),deal:lines("f-deal"),minYears:Number(g("f-min"))||0,idealYears:Number(g("f-ideal"))||0,languages:g("f-lang"),location:g("f-loc"),tz:g("f-tz"),salary:g("f-sal"),justification:g("f-just"),hmName:g("f-hm")};
    let r;
    if(S.editId){r=req(S.editId);Object.assign(r,data);r.status="submitted";r.events.push([TODAY,"Department manager","Resubmitted","Updated after Khalil's comment"])}
    else{r=Object.assign({id:"R-"+(107+S.requests.length-4),requester:"manager",status:"submitted",events:[[TODAY,"Department manager","Submitted",""]],runs:[]},data);S.requests.unshift(r)}
    notify(["ceo"],`New request awaiting approval: ${r.title}`);
    S.editId=null;go("request",{reqId:r.id});toast("Submitted. Khalil has been notified by email and in the app.");
  }
});
render();
</script>
